[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-watcher-backend"
version = "1.0.0"
description = "Dependency Watcher SCA backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "ruamel.yaml>=0.18",
  "defusedxml>=0.7",
  "reportlab>=4.2",
  "packaging>=24.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[project.scripts]
dw-api = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
